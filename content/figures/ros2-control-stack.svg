<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ros2_control 3층 구조와 하드웨어 전환">
  <defs>
    <marker id="rc-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="lbl" x="16" y="24" font-size="13" font-weight="700">
    컨트롤러는 하드웨어를 모릅니다</text>
  <text class="sub" x="16" y="42">
    맨 아래 한 줄만 바꾸면 같은 코드가 가상·시뮬레이션·실물에서 그대로 돕니다</text>

  <!-- MoveIt -->
  <rect class="box" x="140" y="60" width="320" height="34" rx="6"/>
  <text class="lbl" x="300" y="82" text-anchor="middle" font-size="12.5">MoveIt 2 — 경로 계획</text>

  <path class="ln" stroke="var(--border)" stroke-width="1.8" d="M300 94 V110"
        marker-end="url(#rc-a)" color="var(--border)"/>
  <text class="tag mono" x="310" y="107" font-size="10">FollowJointTrajectory</text>

  <!-- 컨트롤러 -->
  <rect class="box-hi" x="60" y="114" width="480" height="52" rx="7"/>
  <text class="hi" x="76" y="136" font-size="12.5">컨트롤러</text>
  <text class="sub mono" x="76" y="154" font-size="10.5">joint_trajectory_controller · joint_state_broadcaster</text>
  <text class="sub" x="524" y="145" text-anchor="end" font-size="10.5">6개 관절 전체를 하나가 제어</text>

  <!-- 매니저 -->
  <rect class="box" x="60" y="176" width="480" height="44" rx="7"/>
  <text class="lbl" x="76" y="196" font-size="12.5">컨트롤러 매니저</text>
  <text class="sub mono" x="76" y="212" font-size="10.5">100 Hz · read() → update() → write()</text>

  <!-- 하드웨어 인터페이스 -->
  <text class="sub" x="300" y="240" text-anchor="middle" font-size="11">
    ↓ 하드웨어 인터페이스 — xacro 인자 하나로 갈아끼웁니다</text>

  <g>
    <rect class="box" x="24"  y="250" width="176" height="60" rx="7"/>
    <rect class="box" x="212" y="250" width="176" height="60" rx="7"/>
    <rect class="box-hi" x="400" y="250" width="176" height="60" rx="7"/>
  </g>
  <g text-anchor="middle">
    <text class="lbl mono" x="112" y="270" font-size="11.5">hardware_type:=mock</text>
    <text class="sub" x="112" y="287" font-size="10.5">GenericSystem</text>
    <text class="sub" x="112" y="301" font-size="10.5">하드웨어 없이 메모리에서</text>

    <text class="lbl mono" x="300" y="270" font-size="11.5">:=gazebo</text>
    <text class="sub" x="300" y="287" font-size="10.5">GazeboSimSystem</text>
    <text class="sub" x="300" y="301" font-size="10.5">중력·마찰·관성 포함</text>

    <text class="hi mono" x="488" y="270" font-size="11.5">:=real</text>
    <text class="sub" x="488" y="287" font-size="10.5">so_arm_hardware</text>
    <text class="sub" x="488" y="301" font-size="10.5">SCS 시리얼 → STS3215</text>
  </g>

  <g class="ln" stroke="var(--border)" stroke-width="1.4">
    <path d="M112 220 V250"/><path d="M300 220 V250"/>
    <path d="M488 220 V250"/>
  </g>
</svg>
