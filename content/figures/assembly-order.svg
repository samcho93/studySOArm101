<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="조립 순서와 나사 종류">
  <defs>
    <marker id="ao-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="lbl" x="16" y="24" font-size="13" font-weight="700">순서를 지키는 것이 전부입니다</text>

  <!-- 전체 순서 -->
  <g>
    <rect class="box" x="16"  y="44" width="104" height="46" rx="6"/>
    <rect class="box" x="132" y="44" width="104" height="46" rx="6"/>
    <rect class="box-hi" x="248" y="44" width="120" height="46" rx="6"/>
    <rect class="box" x="380" y="44" width="104" height="46" rx="6"/>
    <rect class="box" x="496" y="44" width="88" height="46" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text class="lbl" x="68"  y="64" font-size="12">3D 프린팅</text>
    <text class="sub" x="68"  y="80" font-size="10">PLA+ · 인필 15%</text>
    <text class="lbl" x="184" y="64" font-size="12">서포트 제거</text>
    <text class="sub" x="184" y="80" font-size="10">모든 구멍 확인</text>
    <text class="hi"  x="308" y="64" font-size="12">서보 ID · 중위</text>
    <text class="sub" x="308" y="80" font-size="10">반드시 조립 전에</text>
    <text class="lbl" x="432" y="64" font-size="12">관절 1~6 조립</text>
    <text class="sub" x="432" y="80" font-size="10">혼 → 서보 → 구조물</text>
    <text class="lbl" x="540" y="64" font-size="12">보드 · 배선</text>
    <text class="sub" x="540" y="80" font-size="10">M2.5×8</text>
  </g>
  <g class="ln-hi" stroke-width="1.8" color="var(--accent)">
    <path d="M120 67 H126" marker-end="url(#ao-a)"/>
    <path d="M236 67 H242" marker-end="url(#ao-a)"/>
    <path d="M368 67 H374" marker-end="url(#ao-a)"/>
    <path d="M484 67 H490" marker-end="url(#ao-a)"/>
  </g>
  <text class="dg" x="308" y="108" text-anchor="middle" font-size="11">
    ↑ 이걸 건너뛰면 팔을 다시 뜯어야 합니다</text>

  <!-- 관절 공통 패턴 -->
  <rect class="box" x="16" y="128" width="330" height="152" rx="8"/>
  <text class="lbl" x="32" y="150" font-size="12.5">관절마다 반복되는 패턴</text>
  <g class="sub" font-size="11">
    <text x="32" y="176">① 서보 혼 2개 설치 — 위쪽만 <tspan class="hi mono">M3×6</tspan> 고정</text>
    <text x="32" y="198">② 서보를 프레임에 넣고 <tspan class="hi mono">M2×6</tspan> 4개로 고정</text>
    <text x="32" y="220">③ 다음 구조물을 <tspan class="hi mono">M3×6</tspan> 로 양쪽 결합</text>
    <text x="32" y="248" class="wr">예외 — 관절 5(손목 회전)는 혼을 하나만 답니다</text>
    <text x="32" y="268" class="wr">예외 — 12단계 이후 리더/팔로워가 갈립니다</text>
  </g>

  <!-- 나사 -->
  <rect class="box" x="362" y="128" width="222" height="152" rx="8"/>
  <text class="lbl" x="378" y="150" font-size="12.5">나사 세 종류</text>

  <g>
    <rect fill="var(--accent)" opacity="0.5" x="378" y="164" width="26" height="7" rx="2"/>
    <text class="hi mono" x="414" y="172" font-size="11">M2×6</text>
    <text class="sub" x="470" y="172" font-size="10.5">서보 고정 · 가장 작음</text>

    <rect fill="var(--accent)" opacity="0.5" x="378" y="192" width="34" height="9" rx="2"/>
    <text class="hi mono" x="420" y="201" font-size="11">M3×6</text>
    <text class="sub" x="470" y="201" font-size="10.5">구조물 · 혼 고정</text>

    <rect fill="var(--accent)" opacity="0.5" x="378" y="220" width="40" height="10" rx="2"/>
    <text class="hi mono" x="426" y="229" font-size="11">M2.5×8</text>
    <text class="sub" x="470" y="229" font-size="10.5">드라이버 보드</text>
  </g>
  <text class="sub" x="378" y="258" font-size="10.5">
    관절이 뻑뻑하면 과조임입니다 —</text>
  <text class="sub" x="378" y="272" font-size="10.5">
    1/4바퀴 풀고 혼 정렬을 다시 보세요</text>
</svg>
