manipulator:
  # KDL 은 ROS 2 기본 제공. TRAC-IK 를 설치했다면 아래 주석을 사용하세요.
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

  # SO-ARM101 은 5자유도라 위치+방향 6자유도 목표를 완전히 만족시킬 수 없습니다.
  # position_only_ik 를 켜면 위치만 맞추므로 IK 성공률이 크게 올라갑니다.
  position_only_ik: true

# TRAC-IK 사용 예 (sudo apt install ros-humble-trac-ik-kinematics-plugin)
# manipulator:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
#   kinematics_solver_timeout: 0.05
#   solve_type: Distance
