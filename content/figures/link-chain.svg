<svg viewBox="0 0 600 552" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="SO-ARM101의 링크와 조인트 사슬 구조">
  <defs>
    <marker id="lc-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 링크 상자 -->
  <g>
    <rect class="box" x="60" y="20"  width="220" height="36" rx="7"/>
    <rect class="box" x="60" y="96"  width="220" height="36" rx="7"/>
    <rect class="box" x="60" y="172" width="220" height="36" rx="7"/>
    <rect class="box" x="60" y="248" width="220" height="36" rx="7"/>
    <rect class="box" x="60" y="324" width="220" height="36" rx="7"/>
    <rect class="box" x="60" y="400" width="220" height="36" rx="7"/>
    <rect class="box" x="16"  y="486" width="176" height="36" rx="7"/>
    <rect class="box-hi" x="222" y="486" width="220" height="36" rx="7"/>
  </g>

  <g class="lbl mono" text-anchor="middle" font-size="12.5">
    <text x="170" y="43">base_link</text>
    <text x="170" y="119">shoulder_link</text>
    <text x="170" y="195">upper_arm_link</text>
    <text x="170" y="271">lower_arm_link</text>
    <text x="170" y="347">wrist_link</text>
    <text x="170" y="423">gripper_link</text>
    <text x="104" y="509" font-size="11">moving_jaw_…_link</text>
    <text class="hi" x="332" y="509">gripper_frame_link</text>
  </g>

  <!-- 연결선 -->
  <g class="ln" stroke-width="1.6">
    <path d="M170 56  V96"/>
    <path d="M170 132 V172"/>
    <path d="M170 208 V248"/>
    <path d="M170 284 V324"/>
    <path d="M170 360 V400"/>
    <path d="M170 436 V462 H104 V486"/>
    <path d="M170 462 H332 V486"/>
  </g>

  <!-- 조인트 마커 -->
  <g>
    <circle class="box-hi" cx="170" cy="76"  r="10"/>
    <circle class="box-hi" cx="170" cy="152" r="10"/>
    <circle class="box-hi" cx="170" cy="228" r="10"/>
    <circle class="box-hi" cx="170" cy="304" r="10"/>
    <circle class="box-hi" cx="170" cy="380" r="10"/>
    <circle class="box-hi" cx="104" cy="474" r="9"/>
    <rect   class="box"    x="324" y="466" width="16" height="16" rx="3"/>
  </g>

  <!-- 조인트 이름 · 한계 -->
  <g>
    <text class="hi mono" x="300" y="72"  font-size="12.5">shoulder_pan</text>
    <text class="sub"     x="300" y="88">±110°  ·  서보 1</text>

    <text class="hi mono" x="300" y="148" font-size="12.5">shoulder_lift</text>
    <text class="sub"     x="300" y="164">±100°  ·  서보 2</text>

    <text class="hi mono" x="300" y="224" font-size="12.5">elbow_flex</text>
    <text class="sub"     x="300" y="240">±96.8°  ·  서보 3</text>

    <text class="hi mono" x="300" y="300" font-size="12.5">wrist_flex</text>
    <text class="sub"     x="300" y="316">±95°  ·  서보 4</text>

    <text class="hi mono" x="300" y="376" font-size="12.5">wrist_roll</text>
    <text class="sub"     x="300" y="392">−157°~163°  ·  서보 5</text>

    <text class="hi mono" x="16" y="458" font-size="12">gripper</text>
    <text class="sub"     x="16" y="472" font-size="10.5">−10°~100° · 서보 6</text>

    <text class="tag mono" x="352" y="472" font-size="11">fixed</text>
  </g>

  <!-- 범례 -->
  <g>
    <circle class="box-hi" cx="470" cy="34" r="9"/>
    <text class="sub" x="486" y="38">revolute 조인트</text>
    <rect class="box" x="461" y="60" width="16" height="16" rx="3"/>
    <text class="sub" x="486" y="72">fixed 조인트</text>
    <rect class="box" x="461" y="86" width="16" height="16" rx="3"/>
    <text class="sub" x="486" y="98">링크(강체)</text>
  </g>

  <!-- 자유도 표시 -->
  <g>
    <path class="ln-hi" stroke-width="1.4" stroke-dasharray="4 4"
          d="M44 76 V380" marker-start="url(#lc-arrow)" marker-end="url(#lc-arrow)"
          color="var(--accent)"/>
    <text class="hi" x="38" y="228" font-size="11.5" text-anchor="end"
          transform="rotate(-90 38 228)">공간 자세를 정하는 5자유도</text>
  </g>
</svg>
