<svg viewBox="0 0 600 262" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="텔레오퍼레이션 제어 루프와 데이터 기록">
  <defs>
    <marker id="tl-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="lbl" x="16" y="24" font-size="13" font-weight="700">
    텔레오퍼레이션 루프 — 초당 30~60회</text>

  <!-- 사람 -->
  <circle class="box" cx="52" cy="104" r="14"/>
  <path class="ln" stroke="var(--border)" stroke-width="2" d="M52 118 V146 M38 130 H66 M42 168 L52 146 L62 168"/>
  <text class="sub" x="52" y="190" text-anchor="middle">사람</text>

  <!-- 리더 -->
  <rect class="box" x="104" y="76" width="118" height="56" rx="7"/>
  <text class="lbl" x="163" y="100" text-anchor="middle" font-size="12.5">리더 암</text>
  <text class="sub mono" x="163" y="118" text-anchor="middle" font-size="10.5">get_action()</text>

  <!-- 팔로워 -->
  <rect class="box-hi" x="286" y="76" width="118" height="56" rx="7"/>
  <text class="hi" x="345" y="100" text-anchor="middle" font-size="12.5">팔로워 암</text>
  <text class="sub mono" x="345" y="118" text-anchor="middle" font-size="10.5">send_action()</text>

  <!-- 카메라 -->
  <rect class="box" x="286" y="164" width="118" height="46" rx="7"/>
  <text class="lbl" x="345" y="183" text-anchor="middle" font-size="12">카메라</text>
  <text class="sub" x="345" y="199" text-anchor="middle" font-size="10.5">손목 · 전역</text>

  <!-- 데이터셋 -->
  <rect class="box" x="462" y="76" width="122" height="134" rx="7"/>
  <text class="lbl" x="523" y="100" text-anchor="middle" font-size="12.5">데이터셋</text>
  <text class="sub mono" x="523" y="122" text-anchor="middle" font-size="10">action</text>
  <text class="sub mono" x="523" y="140" text-anchor="middle" font-size="10">observation.state</text>
  <text class="sub mono" x="523" y="158" text-anchor="middle" font-size="10">observation.images</text>
  <text class="sub" x="523" y="184" text-anchor="middle" font-size="10.5">lerobot-record</text>

  <!-- 화살표 -->
  <path class="ln" stroke="var(--border)" stroke-width="2" d="M76 104 H98" marker-end="url(#tl-a)" color="var(--border)"/>
  <path class="ln-hi" stroke-width="2.2" d="M222 104 H280" marker-end="url(#tl-a)" color="var(--accent)"/>
  <text class="hi" x="251" y="94" text-anchor="middle" font-size="11">각도 6개</text>

  <path class="ln" stroke="var(--text-faint)" stroke-width="1.6" stroke-dasharray="4 3"
        d="M222 116 H280" />
  <text class="sub" x="251" y="132" text-anchor="middle" font-size="10">지연 수십 ms</text>

  <path class="ln" stroke="var(--border)" stroke-width="1.6" d="M404 104 H456" marker-end="url(#tl-a)" color="var(--border)"/>
  <path class="ln" stroke="var(--border)" stroke-width="1.6" d="M404 187 H432 V150 H456" marker-end="url(#tl-a)" color="var(--border)"/>
  <path class="ln" stroke="var(--border)" stroke-width="1.6" d="M163 132 V222 H432 V212" marker-end="url(#tl-a)" color="var(--border)"/>
  <text class="sub" x="290" y="238" text-anchor="middle" font-size="10.5">
    리더의 각도는 명령이면서 동시에 정답 레이블입니다</text>

  <text class="sub" x="16" y="44">
    <tspan class="hi">텔레오퍼레이션을 하는 것 자체가 데이터 수집</tspan>입니다 —
    같은 루프에 기록만 얹으면 됩니다.</text>
</svg>
